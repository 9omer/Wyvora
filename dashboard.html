<header>

<h1 id="dashboardTitle">📊 İşletme Paneli</h1>

<p>
Wyvora AI işletmenizi analiz ediyor.
</p>

</header>

<section>

<h2>🏢 İşletme Bilgileri</h2>

<div class="ai-message">

<p id="dashboardBusinessName"></p>

<p id="dashboardPhone"></p>

<p id="dashboardAddress"></p>

<p id="dashboardHours"></p>

</div>

</section>

<section>


<div>

<h3>🍽 Menü Ürünleri</h3>

<h2 id="productCount">
0
</h2>

</div>

<div>

<h3>📷 Galeri Fotoğrafı</h3>

<h2 id="photoCount">
0
</h2>

</div>

<div>

<h3>⭐ Ortalama Puan</h3>

<h2>
4.8
</h2>

</div>



<div>

<h3>📅 Rezervasyon</h3>

<h2 id="reservationCount">
0
</h2>

</div>



<div>

<h3>🤖 AI Önerileri</h3>

<h2 id="aiCount">
3
</h2>

</div>


</section>



<section>

<h2>📅 Son Rezervasyonlar</h2>

<div id="dashboardReservations">

</div>

</section>

<section>

<h2>🤖 Wyvora AI Önerileri</h2>


<div id="aiSuggestions">


</div>


</section>

<script>

if(localStorage.getItem("loggedIn") !== "true"){

    window.location.href="admin.html";

}
</script>

<script>

let businessCode =
localStorage.getItem("activeBusinessCode");


let products =
JSON.parse(
localStorage.getItem("products_" + businessCode)
) || [];


document.getElementById("productCount").innerHTML =
products.length;



let reservations =
JSON.parse(
localStorage.getItem("reservations_" + businessCode)
) || [];


document.getElementById("reservationCount").innerHTML =
reservations.length;



let photos =
JSON.parse(
localStorage.getItem("photos_" + businessCode)
) || [];


document.getElementById("photoCount").innerHTML =
photos.length;

<script>

let activeCode =
localStorage.getItem("activeBusinessCode");


let businesses =
JSON.parse(localStorage.getItem("businesses")) || [];


let business =
businesses.find(function(item){

    return item.code === activeCode;

});


if(business){


document.getElementById("dashboardBusinessName").innerHTML =
"🏢 " + (business.name || "");


document.getElementById("dashboardPhone").innerHTML =
"📞 " + (business.phone || "");


document.getElementById("dashboardAddress").innerHTML =
"📍 " + (business.address || "");


document.getElementById("dashboardHours").innerHTML =
"🕒 " + (business.hours || "");


}
<script>

let dashCode =
localStorage.getItem("activeBusinessCode");


let dashReservations =
JSON.parse(
localStorage.getItem("reservations_" + dashCode)
) || [];


let reservationBox =
document.getElementById("dashboardReservations");


if(reservationBox){


reservationBox.innerHTML = "";


dashReservations.slice(-5).forEach(function(reservation){


reservationBox.innerHTML += `

<div class="ai-message">

<h3>${reservation.name}</h3>

<p>📅 Tarih: ${reservation.date}</p>

<p>👥 Kişi: ${reservation.count}</p>

</div>

`;

});


}


</script>
</script>



<script src="script.js"></script>



<script>

let dashboardCode =
localStorage.getItem("activeBusinessCode");


let dashboardBusinesses =
JSON.parse(localStorage.getItem("businesses")) || [];


let dashboardBusiness =
dashboardBusinesses.find(function(item){

    return item.code === dashboardCode;

});


if(dashboardBusiness){

    document.getElementById("dashboardTitle").innerHTML =
    "📊 " + dashboardBusiness.name + " Paneli";


    document.getElementById("dashboardBusinessName").innerHTML =
    "🏢 " + (dashboardBusiness.name || "");


    document.getElementById("dashboardPhone").innerHTML =
    "📞 " + (dashboardBusiness.phone || "");


    document.getElementById("dashboardAddress").innerHTML =
    "📍 " + (dashboardBusiness.address || "");


    document.getElementById("dashboardHours").innerHTML =
    "🕒 " + (dashboardBusiness.hours || "");

}

</script>



</body>

</html>
